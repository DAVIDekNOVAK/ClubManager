# Lokalno razvojno okolje (glej docs/adr/0007-docker-compose-za-lokalni-razvoj.md).
# Zagon: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: clubmanager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clubmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clubmanager}
      POSTGRES_DB: ${POSTGRES_DB:-clubmanager}
    ports:
      # Na gostitelju privzeto 5433, da ni navzkrižja z morebitnim lokalno nameščenim PostgreSQL (5432).
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clubmanager} -d ${POSTGRES_DB:-clubmanager}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Mailpit prestreže vso odhodno e-pošto (povabila) – nič se ne pošlje na prave naslove.
  # Spletni vmesnik: http://localhost:8025
  mail:
    image: axllent/mailpit:latest
    container_name: clubmanager-mail
    restart: unless-stopped
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  db-data:
